[package]
name = "mse-notes"
version = "1.0.0"
compiler = "0.15.0"
entrypoint = "lib.typ"
authors = ["Aubry Mangold <aubry.mangold@master.hes-so.ch>"]
license = "MIT-0"
description = "Personal notes templates for HES-SO MSE courses"
repository = "https://github.com/a-mango/typst-templates"
keywords = ["notes", "mse", "hes-so", "master"]
categories = ["paper"]
# Build artifacts do not belong in a published package.
exclude = ["notes.pdf"]

[template]
path = "template"
entrypoint = "notes.typ"
