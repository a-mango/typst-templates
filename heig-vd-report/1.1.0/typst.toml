[package]
name = "heig-vd-report"
version = "1.1.0"
compiler = "0.15.0"
entrypoint = "lib.typ"
authors = ["Aubry Mangold <aubry.mangold@heig-vd.ch>"]
license = "MIT-0"
description = "Report template for HEIG-VD courses"
repository = "https://github.com/a-mango/typst-templates"
keywords = ["report", "heig-vd", "hes-so"]
categories = ["paper"]
# Build artifacts do not belong in a published package.
exclude = ["report.pdf"]

[template]
path = "template"
entrypoint = "report.typ"
