[package]
name = "heig-vd-handout"
version = "1.0.0"
compiler = "0.15.0"
entrypoint = "lib.typ"
authors = ["Aubry Mangold <aubry.mangold@heig-vd.ch>"]
license = "MIT-0"
description = "Practical work handout template for HEIG-VD courses"
repository = "https://github.com/a-mango/typst-templates"
keywords = ["handout", "practical-work", "labs", "heig-vd", "hes-so"]
categories = ["paper"]
# Build artifacts do not belong in a published package.
exclude = ["handout.pdf", "handout-solutions.pdf"]

[template]
path = "template"
entrypoint = "handout.typ"
