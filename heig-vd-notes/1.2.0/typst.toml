[package]
name = "heig-vd-notes"
version = "1.2.0"
compiler = "0.15.0"
entrypoint = "lib.typ"
authors = ["Aubry Mangold <aubry.mangold@heig-vd.ch>"]
license = "MIT-0"
description = "Personal notes templates for HEIG-VD courses"
repository = "https://github.com/a-mango/typst-templates"
keywords = ["notes", "heig-vd", "hes-so"]
categories = ["paper"]
# Build artifacts do not belong in a published package.
exclude = ["notes.pdf"]

[template]
path = "template"
entrypoint = "notes.typ"
